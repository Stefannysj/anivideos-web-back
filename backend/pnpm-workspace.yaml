# Este archivo solo configura este proyecto; no enlaza frontend y backend.
packages:
  - '.'

engineStrict: true
savePrefix: ''
minimumReleaseAge: 1440
blockExoticSubdeps: true
verifyStoreIntegrity: true
strictDepBuilds: true
verifyDepsBeforeRun: error
enablePrePostScripts: false

# Ningun script de dependencias queda autorizado automaticamente.
# Revisar los avisos con pnpm why y aprobar solo lo necesario.
allowBuilds: { esbuild: false }
